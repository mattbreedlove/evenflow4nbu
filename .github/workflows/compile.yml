name: Compile C Code

on:
  push:
    branches:
      - main  # Trigger this action on a push to the main branch
  pull_request:
    branches:
      - main  # Trigger on PRs to the main branch

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up GCC
      run: sudo apt-get install gcc make

    - name: Compile C code
      run: |
        gcc -O2 -static -pthread evenflow4nbu.c -o evenflow4nbu

    - name: Upload binary as artifact
      uses: github/artifacts@v1  # New action for uploading artifacts
      with:
        name: evenflow4nbu-binary
        path: evenflow4nbu
