name: Compile C Code

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up GCC
      run: sudo apt-get install gcc make

    - name: Compile C code
      run: |
        gcc -O2 -static -pthread evenflow4nbu.c -o evenflow4nbu

    - name: Upload binary as artifact
      run: |
        # Use GitHub's new artifact upload tool
        node -e "
        const core = require('@actions/core');
        const artifact = require('@actions/artifacts');
        const artifactClient = artifact.create();
        
        const paths = ['evenflow4nbu']; // Path to your compiled binary
        const name = 'evenflow4nbu-binary'; // Name of the artifact
        
        async function uploadArtifact() {
          const artifactName = name;
          const uploadResponse = await artifactClient.uploadArtifact(artifactName, paths, process.cwd());
          if (uploadResponse.failedItems.length > 0) {
            core.setFailed('Artifact upload failed.');
          }
        }
        uploadArtifact();
        "
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
