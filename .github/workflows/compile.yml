name: Compile C Code

on:
  push:
    branches:
      - main  # Trigger on push to the main branch
  pull_request:
    branches:
      - main  # Trigger on PR to the main branch

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up GCC
      run: sudo apt-get install gcc make

    - name: Compile C code
      run: |
        # Ensure the file exists before compiling
        if [ ! -f "evenflow4nbu.c" ]; then
          echo "Error: evenflow4nbu.c not found!"
          exit 1
        fi
        
        # Compile the C code
        gcc -O2 -static -pthread evenflow4nbu.c -o evenflow4nbu

    - name: Upload binary as artifact
      uses: actions/upload-artifact@v3  # Using the artifact upload action again (still works)
      with:
        name: evenflow4nbu-binary
        path: evenflow4nbu
